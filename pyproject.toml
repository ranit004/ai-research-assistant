[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant"
version = "0.1.0"
description = "Backend-only multi-step research assistant API (FastAPI, LangChain, LangGraph, Qdrant)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "langchain-groq>=1.1.3",
    "fastembed>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
